# Build lib/, pack a tarball, and publish it as a GitHub Release.
# Triggered by pushing a `v*` tag (e.g. `git tag v0.1.0 && git push --tags`).
#
# The devDependencies use `link:../deepseek-harness/...` which only exists in
# the local dev checkout.  CI has no deepseek-harness, so this workflow stubs
# the linked directories (each with a package.json whose name matches) before
# `pnpm install`, then builds and packs the built artifacts.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: "Stub deepseek-harness for link: devDependencies"
        run: |
          set -e
          node -e '
            const fs = require("fs");
            const path = require("path");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const [name, spec] of Object.entries(pkg.devDependencies || {})) {
              if (!spec.startsWith("link:")) continue;
              const target = spec.slice(5);
              fs.mkdirSync(target, { recursive: true });
              fs.writeFileSync(
                path.join(target, "package.json"),
                JSON.stringify({ name, version: "0.0.0", type: "module" }, null, 2) + "\n",
              );
            }
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: node build.mjs

      - name: Pack tarball
        run: |
          set -e
          rm -rf package dsh-model-filter.tgz
          mkdir -p package
          cp package.json cordis.patch.yml dsh.plugin.json README.md LICENSE package/
          cp -r lib package/lib
          tar -czf dsh-model-filter.tgz package
          tar -tzf dsh-model-filter.tgz | head

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dsh-model-filter.tgz \
            --repo "${{ github.repository }}" \
            --generate-notes
